<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOIX ERP</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="profile.css"></head><body><div id="login" class="login"><div class="login-card"><div class="brand">CHOIX <span>ERP</span></div><p>Business Management System</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><button type="button" id="setupOwnerBtn" class="secondary">First time? Create Owner Account</button><div id="loginMsg" class="msg"></div></form></div></div><div id="app" class="hidden"><aside class="sidebar" style="overflow-y:auto;overflow-x:hidden;"><div class="brand">CHOIX <span>ERP</span></div><nav id="nav"><button data-page="dashboard">Dashboard</button><button data-page="pos">POS / Sales</button><button data-page="customers">Customers</button><button data-page="products">Products</button><button data-page="inventory">Inventory</button><button data-page="purchases">Purchases</button><button data-page="purchaseEntry">Purchase Entry</button><button data-page="suppliers">Suppliers</button><button data-page="customerDue">Customer Due</button><button data-page="supplierDue">Supplier Due</button><button data-page="membership">Membership</button><button data-page="hr">HR & Payroll</button><button data-page="accounts">Accounts</button><button data-page="accountTransactions">Transactions</button><button data-page="customerLedger">Customer Ledger</button><button data-page="supplierLedger">Supplier Ledger</button><button data-page="expenseEntry">Expense</button><button data-page="advancedReports">Advanced Reports</button><button data-page="accountingSettings">Auto Accounting</button><button data-page="reports">Reports</button><button data-page="users">Users & Roles</button><button data-page="branches">Branches</button></nav><button id="logout" class="logout">Logout</button></aside><main><header><h1 id="pageTitle">Dashboard</h1><div id="userInfo"></div></header><section id="content"></section></main></div><div id="bootError" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;border-radius:12px;padding:14px;font:14px Arial;box-shadow:0 10px 30px #0002"><b>CHOIX ERP startup error</b><div id="bootErrorText" style="margin-top:6px;white-space:pre-wrap"></div></div><script>(function(){const box=document.getElementById("bootError"),txt=document.getElementById("bootErrorText");function show(e){const m=(e&&e.message)||String(e||"Unknown startup error");if(box)box.style.display="block";if(txt)txt.textContent=m;const lm=document.getElementById("loginMsg");if(lm)lm.textContent="ERP startup error: "+m}window.addEventListener("error",e=>show(e.error||e.message));window.addEventListener("unhandledrejection",e=>show(e.reason));function load(src,ok){const x=document.createElement("script");x.src=src;x.onload=ok;x.onerror=()=>show("Failed to load "+src);document.body.appendChild(x)}load("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",function(){if(!window.supabase){show("Supabase client library loaded but window.supabase is missing.");return}load("app.js?v=20260925.3",function(){if(typeof window.init==="function")window.init();load("profile-ui.js?v=20260925.3",function(){})})})})()</script><script>(function(){function initials(n){return String(n||"U").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"U"}function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}async function renderProfile(){const host=document.getElementById("userInfo");if(!host||host.dataset.profileFallback)return false;const raw=(host.textContent||"").trim();if(!raw||raw.toLowerCase()==="dashboard")return false;host.dataset.profileFallback="1";const parts=raw.split("·").map(x=>x.trim()),name=parts[0]||"User",role=parts[1]||"User";host.className="profile-host";host.innerHTML='<button id="fallbackProfileTrigger" class="profile-trigger" type="button"><span class="profile-avatar">'+esc(initials(name))+'</span><span class="profile-summary"><b>'+esc(name)+'</b><small>'+esc(role)+'</small></span><span class="profile-chevron">⌄</span></button><div id="fallbackProfileMenu" class="profile-menu hidden"><button id="fallbackProfileOpen" type="button">⚙ Profile System</button><button id="fallbackPassword" type="button">🔒 Change Password</button><div class="profile-divider"></div><button id="fallbackLogout" type="button">↪ Logout</button></div>';const trigger=document.getElementById("fallbackProfileTrigger"),menu=document.getElementById("fallbackProfileMenu");trigger.onclick=e=>{e.stopPropagation();menu.classList.toggle("hidden")};document.addEventListener("click",e=>{if(!host.contains(e.target))menu.classList.add("hidden")});document.getElementById("fallbackLogout").onclick=()=>document.getElementById("logout")?.click();document.getElementById("fallbackPassword").onclick=()=>fallbackPassword();document.getElementById("fallbackProfileOpen").onclick=()=>fallbackProfile();return true}async function getProfile(){const c=window.supabase;if(!c?.auth)return null;const {data:{user}}=await c.auth.getUser();if(!user)return null;const {data}=await c.from("users").select("id,full_name,email,username,phone,branch_id,roles(name)").eq("auth_user_id",user.id).single();return data||null}async function fallbackProfile(){const p=await getProfile();if(!p)return alert("Profile could not be loaded.");const r=p.roles?.name||"User",editable=["Owner","Admin","Manager"].includes(r);let branch="Head Office / All";if(p.branch_id){const {data}=await window.supabase.from("branches").select("name").eq("id",p.branch_id).maybeSingle();branch=data?.name||"Assigned Branch"}const body='<div class="profile-system-card"><div class="profile-hero"><div class="profile-avatar profile-avatar-lg">'+esc(initials(p.full_name||p.email))+'</div><div><h3>'+esc(p.full_name||"User")+'</h3><p>'+esc(r)+" · "+esc(branch)+'</p></div></div><form id="fallbackProfileForm"><div class="form-grid"><label>Full Name<input id="fp_name" value="'+esc(p.full_name||"")+'" '+(editable?"":"disabled")+'></label><label>Username<input id="fp_username" value="'+esc(p.username||"")+'" '+(editable?"":"disabled")+'></label><label>Phone<input id="fp_phone" value="'+esc(p.phone||"")+'" '+(editable?"":"disabled")+'></label><label>Email<input value="'+esc(p.email||"")+'" disabled></label><label>Role<input value="'+esc(r)+'" disabled></label><label>Branch<input value="'+esc(branch)+'" disabled></label></div><p class="profile-note">'+(editable?"Owner, Admin and Manager can edit profile details.":"Branch users can view their profile but cannot edit controlled details.")+'</p>'+(editable?'<button class="primary" type="submit">Save Profile</button>':"")+'<button type="button" id="fp_change_password">Change Password</button></form></div>';if(typeof window.modal==="function"){window.modal("Profile System",body);document.getElementById("fallbackProfileForm")?.addEventListener("submit",async e=>{e.preventDefault();const {error}=await window.supabase.rpc("update_my_profile",{p_full_name:document.getElementById("fp_name")?.value||"",p_phone:document.getElementById("fp_phone")?.value||"",p_username:document.getElementById("fp_username")?.value||""});if(error)return alert(error.message);window.closeModal?.();alert("Profile updated successfully.")});document.getElementById("fp_change_password")?.addEventListener("click",fallbackPassword)}else alert("Profile System is loading. Please try again.")}async function fallbackPassword(){const p=document.getElementById("new_password");if(typeof window.modal!=="function")return alert("Profile System is loading. Please try again.");window.modal("Change Password",'<form id="fp_password"><input id="new_password" type="password" minlength="8" placeholder="New password" required><input id="new_password2" type="password" minlength="8" placeholder="Confirm new password" required><button class="primary">Update Password</button></form>');document.getElementById("fp_password")?.addEventListener("submit",async e=>{e.preventDefault();const a=document.getElementById("new_password").value,b=document.getElementById("new_password2").value;if(a!==b)return alert("Passwords do not match.");const {error}=await window.supabase.auth.updateUser({password:a});if(error)return alert(error.message);window.closeModal?.();alert("Password updated successfully.")})}let n=0;const t=setInterval(()=>{if(renderProfile()||++n>80)clearInterval(t)},250);new MutationObserver(()=>renderProfile()).observe(document.getElementById("userInfo")||document.body,{childList:true,subtree:true,characterData:true})})()</script></body></html>
